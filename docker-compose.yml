services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: zoo_guide
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./he_thong/database/zoo_guide.sql:/docker-entrypoint-initdb.d/01-zoo_guide.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  backend:
    build: ./he_thong
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/zoo_guide
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
